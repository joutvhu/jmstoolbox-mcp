name: Release & Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release/publish (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      publish_npm:
        description: 'Publish to NPM registry'
        type: boolean
        default: true
      publish_maven:
        description: 'Publish to Maven Central'
        type: boolean
        default: true
      upload_assets:
        description: 'Upload assets to GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build, Package & Publish (Release Assets, NPM, Maven Central)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.version }}"
          else
            RAW_TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION="${RAW_TAG#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Releasing version: ${VERSION} from tag/input: ${RAW_TAG}"

      - name: Update versions in pom.xml and package.json
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          # Update Maven version using wrapper
          ./mvnw versions:set -DnewVersion=${VERSION} -DgenerateBackupPoms=false
          # Update NPM package.json version
          npm version ${VERSION} --allow-same-version --no-git-tag-version

      - name: Build Fat JAR with Maven Wrapper
        run: |
          ./mvnw clean package -DskipTests
          # Copy shaded jar to root folder for npm packaging
          cp target/jmstoolbox-mcp.jar jmstoolbox-mcp.jar
          chmod +x bin/index.js

      - name: Create Portable Zip for GitHub Release
        run: |
          mkdir -p dist
          cp target/jmstoolbox-mcp.jar dist/
          cp jmstoolbox-mcp.cmd dist/
          cp jmstoolbox-mcp.sh dist/
          chmod +x dist/jmstoolbox-mcp.sh
          cd dist
          zip -r ../jmstoolbox-mcp-${{ steps.get_version.outputs.VERSION }}-portable.zip .
          cd ..

      # -------------------------------------------------------------
      # 1. Upload Assets to the Created GitHub Release
      # -------------------------------------------------------------
      - name: Upload Release Assets
        if: ${{ github.event_name == 'release' || github.event.inputs.upload_assets == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          files: |
            target/jmstoolbox-mcp.jar
            jmstoolbox-mcp-${{ steps.get_version.outputs.VERSION }}-portable.zip
            jmstoolbox-mcp.cmd
            jmstoolbox-mcp.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------
      # 2. Publish to NPM Registry (with version existence check)
      # -------------------------------------------------------------
      - name: Publish to NPM
        if: ${{ github.event_name == 'release' || github.event.inputs.publish_npm == 'true' }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          PKG_NAME=$(node -p "require('./package.json').name")

          # Check if this exact version is already published on NPM
          NPM_EXISTS=$(npm view "${PKG_NAME}@${VERSION}" version 2>/dev/null || true)
          if [ "$NPM_EXISTS" = "$VERSION" ]; then
            echo "::notice::Version ${VERSION} already exists on NPM registry. Skipping NPM publish to prevent 403 / EPUBLISHCONFLICT."
          elif [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publishing ${PKG_NAME}@${VERSION} to NPM..."
            npm publish --access public
          else
            echo "::notice::NPM_TOKEN secret is not set. Skipping NPM publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # -------------------------------------------------------------
      # 3. Publish to Maven Central
      # -------------------------------------------------------------
      - name: Publish to Maven Central
        if: ${{ github.event_name == 'release' || github.event.inputs.publish_maven == 'true' }}
        run: |
          if [ -n "$MAVEN_USERNAME" ] && [ -n "$MAVEN_PASSWORD" ]; then
            echo "Publishing to Maven Central..."
            ./mvnw clean deploy -P release -DskipTests
          else
            echo "::notice::OSSRH secrets are not set. Skipping Maven Central publish."
          fi
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
